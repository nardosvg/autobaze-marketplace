# AutoBaze Marketplace (Mercur) — stack de producao na VPS.
#
# Desenho alinhado com a saida do Cloudflare Workers (27/08): o app Next.js ja
# roda em container na VPS, na rede externa `supabase_default`, exposto por
# cloudflared. O marketplace entra na MESMA rede, entao app <-> Mercur falam
# por nome de container, sem sair pra internet:
#
#   app  -> http://mercur-api:9000            (MERCUR_BACKEND_URL)
#   Mercur -> http://operify-app:3000/...     (AUTOBAZE_WEBHOOK_URL)
#
# So o storefront e o painel do Mercur precisam de rosto publico, e ambos vao
# pelo cloudflared (127.0.0.1), sem porta no firewall. Mesmo padrao do app,
# do ntfy e do evolution-api.
#
# Sobe com:
#   docker compose -f deploy/docker-compose.prod.yml --env-file /opt/mercur/.env up -d
#
# Postgres SEPARADO do Supabase de proposito: schema proprio, sem FK cruzando,
# e um problema no marketplace nunca compete por conexao com o PDV.
services:
  mercur-pg:
    image: postgres:16-alpine
    container_name: mercur-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: mercur
      POSTGRES_PASSWORD: ${MERCUR_DB_PASSWORD}
      POSTGRES_DB: mercur
    volumes:
      - mercur_pgdata:/var/lib/postgresql/data
    networks:
      - supabase_default
    # Limite explicito nao e' sobre caber: e' pra um vazamento aqui nao
    # derrubar o Postgres do Supabase ao lado (o que o powersync-mongo sem
    # limite fez em 25/08).
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2.0
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mercur']
      interval: 300s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'

  mercur-redis:
    image: redis:7-alpine
    container_name: mercur-redis
    restart: unless-stopped
    networks:
      - supabase_default
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 300s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'

  mercur-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: ${MERCUR_API_IMAGE:-mercur-api:latest}
    container_name: mercur-api
    restart: unless-stopped
    depends_on:
      mercur-pg:
        condition: service_healthy
      mercur-redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://mercur:${MERCUR_DB_PASSWORD}@mercur-pg:5432/mercur
      REDIS_URL: redis://mercur-redis:6379
      # Webhook de pedido vai pelo nome do container do app: nao passa pelo
      # cloudflared, nao aparece na internet e nao depende de DNS externo.
      AUTOBAZE_WEBHOOK_URL: http://operify-app:3000/api/webhooks/marketplace/pedido
      # Medusa e' pesado no boot; teto de heap ABAIXO do mem_limit pro GC ter
      # chance antes do OOMKill do kernel.
      NODE_OPTIONS: --max-old-space-size=1536
    ports:
      # Bind explicito em 127.0.0.1: sem o prefixo o Docker publica em 0.0.0.0
      # escrevendo direto no iptables, ANTES do ufw.
      - '127.0.0.1:9000:9000'
    networks:
      - supabase_default
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9000/health || exit 1']
      interval: 300s
      timeout: 5s
      retries: 3
      # Boot do Medusa carrega modulos e roda migrations: 180s de folga.
      start_period: 180s
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '3'

  mercur-storefront:
    build:
      context: ../b2c-marketplace-storefront
      dockerfile: ../deploy/Dockerfile.storefront
      args:
        # NEXT_PUBLIC_* sao INLINADAS no bundle em tempo de build (mesma
        # pegadinha do Dockerfile do app). Faltando uma, ela vira `undefined`
        # no browser e o sintoma aparece longe daqui.
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://marketplace.autobaze.com.br}
        NEXT_PUBLIC_DEFAULT_REGION: br
        NEXT_PUBLIC_SITE_NAME: AutoBaze Marketplace
    image: ${MERCUR_STOREFRONT_IMAGE:-mercur-storefront:latest}
    container_name: mercur-storefront
    restart: unless-stopped
    depends_on:
      mercur-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Server-side: fala com a API por dentro da rede.
      MEDUSA_BACKEND_URL: http://mercur-api:9000
      REVALIDATE_SECRET: ${STOREFRONT_REVALIDATE_SECRET}
    ports:
      - '127.0.0.1:3300:3000'
    networks:
      - supabase_default
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '3'

volumes:
  mercur_pgdata:

networks:
  # Mesma rede do app e do Supabase (criada pelo stack do Supabase).
  supabase_default:
    external: true
